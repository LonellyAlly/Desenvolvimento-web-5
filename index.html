<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint 5 - Assincronismo e APIs</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .box { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .status { font-weight: bold; margin: 10px 0; color: #555; }
        .erro { color: red; }
        .sucesso { color: green; }
        dl { display: grid; grid-template-columns: 80px 1fr; gap: 5px; margin: 0; }
        dt { font-weight: bold; }
        dd { margin: 0; }
        #resultado-pokemon img { width: 120px; height: 120px; }
    </style>
</head>
<body>

    <h1>Desafio - Objetos e Assincronismo</h1>

    <!-- Parte 1: Manipulação de Dados -->
    <div class="box">
        <h2>Parte 1: Processamento de Pedidos</h2>
        <ul id="lista-pedidos"></ul>
        <p><strong>Total Faturado:</strong> <span id="total-faturado"></span></p>
    </div>

    <!-- Parte 2: Buscador de CEP -->
    <div class="box">
        <h2>Parte 2: Buscador de CEP</h2>
        <form id="form-cep">
            <input type="text" id="input-cep" placeholder="Digite apenas os 8 números" maxlength="9">
            <button type="submit" id="btn-cep">Buscar CEP</button>
        </form>
        <div id="status-cep" class="status"></div>
        <dl id="resultado-cep"></dl>
        
        <h3>Histórico de Pesquisas:</h3>
        <ul id="historico-cep"></ul>
    </div>

    <!-- Parte 3: Mini Pokédex -->
    <div class="box">
        <h2>Parte 3: Mini Pokédex</h2>
        <form id="form-pokedex">
            <input type="text" id="input-pokemon" placeholder="Digite o nome do Pokémon">
            <button type="submit" id="btn-pokemon">Buscar Pokémon</button>
        </form>
        <div id="status-pokemon" class="status"></div>
        <div id="resultado-pokemon"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
